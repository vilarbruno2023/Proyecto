<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="auth.js"></script>
    <link rel="stylesheet" href="estilos.css">
    <title>SIGSM - Indicaciones vigentes</title>
</head>
<body>
    <header>
        <div class="hizq">
            <div>
                <h3>S.I.G.S.M.</h3>
            </div>
        </div>

        <div class="hder">
            <a class="boton-enlace" href="./inicio.html">Uso interno</a>
            <button id="btnLogout" type="button">Cerrar sesión</button>
        </div>
    </header>

    <main class="vista-publica">
        <section class="centro centro-publico">
            <div class="carriba">
                <div class="caizq">
                    <div>
                        <h2>Indicaciones para pacientes</h2>
                        <p>Consultá y abrí los documentos PDF de indicaciones vigentes.</p>
                    </div>
                </div>
            </div>

            <div class="filtros" aria-label="Filtros de indicaciones">
                <input type="search" id="buscarIndicacion" placeholder="Buscar indicaciones" aria-label="Buscar indicaciones">
                <select id="filtroArea" aria-label="Filtrar por área">
                    <option value="">Todas las áreas</option>
                    <option value="Salud Reproductiva">Salud Reproductiva</option>
                    <option value="Cardiología">Cardiología</option>
                    <option value="Imagenología">Imagenología</option>
                    <option value="Nefrología">Nefrología</option>
                    <option value="Prevención">Prevención</option>
                </select>
            </div>

            <p id="mensajeIndicaciones" class="mensaje-listado" aria-live="polite"></p>
            <div class="lista-tarjetas" id="listaIndicaciones"></div>
        </section>
    </main>

    <script src="logout.js"></script>
    <script src="listar_tarjetas.js"></script>
</body>
</html>
