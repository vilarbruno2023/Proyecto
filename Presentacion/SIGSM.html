<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="auth.js"></script>
    <link rel="stylesheet" href="estilos.css">
    <title>Proyecto SIGSM</title>
</head>
<body>
    <header>
        <div class="hizq">
            <div>
                <h3>S.I.G.S.M.</h3>
                <button id="btnLogout">Cerrar Sesión</button>
            </div>
        </div>
        <div class="hder">
            <a href="./index.html"><button>Pacientes</button></a>
        </div>
    </header>

    <aside>
        <div class="aizq">
            <div>
                <button>Indicaciones</button>
            </div>
        </div>
        <div class="ader">
            <div>
                <p>Documentación</p>
            </div>
            <div>
                <button id="btnLogoutAside" type="button">Cerrar sesión</button>
            </div>
        </div>
    </aside>

    <main>
        <div class="centro">
            <div class="carriba">
                <div class="caizq">
                    <div>
                        <div>Administración de indicaciones</div>
                        <div>Disponible solo para administrativos del área de documentación.</div>
                    </div>
                </div>
                <div class="cader">
                    <button type="button" id="btnNewIndicacion">Nueva indicación</button>
                </div>
            </div>

            <div id="formularioDiv" style="display:none;">
                <form action="../api/guardar_documento.php" method="POST">
                    <div class="medioc">
                        <div class="c1">
                            <label>Nombre de la indicación</label>
                            <input type="text" name="titulo" required placeholder="Ej: Indicaciones IVE">
                        </div>

                        <div class="c2">
                            <label>Categoría / Área</label>
                            <select name="idCategoria" required>
                                <option value="1">Salud Reproductiva</option>
                                <option value="2">Cardiología</option>
                                <option value="3">Nefrología</option>
                                <option value="4">Imagenología</option>
                                <option value="5">Prevención</option>
                            </select>
                        </div>

                        <div class="c3">
                            <label>Estado de la indicación</label>
                            <select name="estado">
                                <option value="Vigente">Vigente</option>
                                <option value="Revisar">Revisar</option>
                            </select>
                        </div>

                        <div class="c4">
                            <label>Resumen visible al paciente</label>
                            <textarea class="areat" name="resumen" placeholder="Preparación previa, cuidados posteriores y contactos útiles para el procedimiento."></textarea>
                        </div>
                    </div>

                    <div class="medioab">
                        <button type="submit">Publicar cambios</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer>
        <div class="contf">
            <div class="fsup">
                <h3>Indicaciones existentes</h3>
            </div>

            <table id="tablaDocumentos">
                <thead>
                    <tr>
                        <th>TÍTULO</th>
                        <th>CATEGORÍA</th>
                        <th>ESTADO</th>
                        <th>RESUMEN</th>
                        <th>CÓDIGO QR</th>
                        <th>ACCIONES</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
        </div>
    </footer>

    <script src="../javascript/logout.js"></script>
    <script src="../javascript/nueva_indicacion.js"></script>
    <script src="../javascript/listar_tabla_admin.js"></script>
</body>
</html>
