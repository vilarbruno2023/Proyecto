<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="estilos.css">
    <title>Usuarios y credenciales | SIGSM</title>
</head>

<body class="pagina-admin">
    <header>
        <div class="hizq">
            <h3>S.I.G.S.M. | Usuarios y credenciales</h3>
        </div>
    </header>
    <nav class="controles-admin"><a class="boton-enlace" href="pagina.php?pagina=panel">Panel</a><a class="boton-enlace"
            href="pagina.php?pagina=usuarios">Usuarios</a><a class="boton-enlace" href="pagina.php?pagina=indicaciones">Indicaciones</a><a
            class="boton-enlace" href="pagina.php?pagina=encuestas">Encuestas</a><a class="boton-enlace" href="pagina.php?pagina=flota">Personal y
            vehículos</a><a class="boton-enlace" href="pagina.php?pagina=traslados">Traslados</a><a class="boton-enlace"
            href="../Negocio/logout.php">Cerrar sesión</a></nav>
    <main class="pagina-contenido">
        <p id="aviso" class="aviso" role="status"></p>
        <div id="contenido">
            <section class="panel">
                <h1>Crear usuario</h1>
                <form id="crearUsuario" class="formulario-grid">
                    <label>Nombre de usuario<input name="nombreUsuario" minlength="3" maxlength="50"
                            pattern="[a-zA-Z0-9._-]+" required></label>
                    <label>Contraseña (mínimo 10)<input type="password" name="contrasenia" minlength="10"
                            required></label>
                    <label>Rol<select name="rol">
                            <option value="funcionario">funcionario</option>
                            <option value="documentacion">documentacion</option>
                            <option value="doctor">doctor</option>
                            <option value="operador">operador</option>
                            <option value="admin">admin</option>
                        </select></label>
                    <button>Crear usuario</button>
                </form>
            </section>
            <section class="panel">
                <h2>Usuarios registrados</h2>
                <div class="tabla-desplazable">
                    <table>
                        <thead><tr><th>Usuario</th><th>Rol</th><th>Cambiar contraseña</th></tr></thead>
                        <tbody id="usuarios"></tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>
    <template id="filaUsuario">
        <tr>
            <td data-usuario></td>
            <td data-rol></td>
            <td><form class="cambiarClave formulario-inline">
                <input type="password" name="nuevaContrasenia" minlength="10" placeholder="Nueva contraseña" required>
                <button>Actualizar</button>
            </form></td>
        </tr>
    </template>
    <template id="sinUsuarios"><tr><td colspan="3"></td></tr></template>
    <script src="admin_acceso.js" defer></script>
    <script src="admin.js" defer></script>
</body>

</html>
